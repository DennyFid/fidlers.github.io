name: Deploy to gh-pages (include LFS)

on:
  push:
    branches:
      - live
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Replace LFS pointers with actual files
        run: git lfs checkout

      - name: Setup Node (optional)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prepare files for GitHub Pages
        run: |
          git lfs pull
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' ./ _site/
          rm -f _site/.gitattributes

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          allow_empty_commit: true