<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Gallery - Fidler Family</title>
				<link rel="stylesheet" href="styles.css">
					<style>
						.gallery-grid {
						display: grid;
						grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
						gap: 1.5rem;
						max-width: 900px;
						margin: 0 auto;
						}
						.gallery-item {
						border-radius: 12px;
						overflow: hidden;
						box-shadow: var(--shadow-md);
						transition: var(--transition);
						background: #fff;
						}
						.gallery-item img {
						width: 100%;
						height: auto;
						display: block;
						}
						.gallery-item.panoramic {
						grid-column: 1 / -1;
						height: 220px;
						}
						.gallery-item.panoramic img {
						width: 100%;
						height: 100%;
						object-fit: cover;
						object-position: center;
						display: block;
						}
					</style>
				</head>
	<body>

		<nav class="navbar" id="navbar">
			<a href="index.html" class="logo">Fidler Family</a>
			<ul class="nav-links">
				<li>
					<a href="index.html">Home</a>
				</li>
				<li>
					<a href="family.html">Our Tree</a>
				</li>
				<li>
					<a href="photos.html" class="active">Gallery</a>
				</li>
				<li>
					<a href="blog.html">Blog</a>
				</li>
				<li>
					<a href="cars.html">Denny's Cars</a>
				</li>
			</ul>
		</nav>

		<header class="hero" style="height: 50vh; padding-top: 100px; background: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;">
			<div class="hero-content">
				<h1 style="font-size: 3rem;">Photo Gallery</h1>
				<p>Cherished moments, captured forever.</p>
			</div>
		</header>

		<main class="container">
			<h2 class="section-title">Memories</h2>

		<div class="gallery-grid">
			<div class="gallery-item panoramic">
				<img src="assets/gallery/lahina_panoramic.jpg" alt="Lahina tree panoramic">
				<div class="caption">lahina_panoramic</div>
			</div>

			<div class="gallery-item">
				<img src="assets/gallery/cat_raccoon_fence.jpg" alt="Jake treeing the racoon">
				<div class="caption">cat_raccoon_fence</div>
			</div>

			<div class="gallery-item">
				<img src="assets/gallery/dancing.gif" alt="kids dancing">
				<div class="caption">dancing</div>
			</div>

			<div class="gallery-item">
				<video controls preload="metadata" poster="assets/gallery/Levi_movie_poster.jpg" style="width:100%;height:auto;display:block;">
					<source src="assets/gallery/Levi_movie.mp4" type="video/mp4">
					Your browser does not support the video tag.
				</video>
				<div class="caption">Levi_movie</div>
			</div>
		</div>
		</main>

		<footer>
			<p>&copy; 2026 The Fidler Family. All rights reserved.</p>
		</footer>

		<script src="script.js"></script>
	</body>
</html>
