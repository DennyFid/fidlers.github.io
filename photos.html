<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Fidler Family</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }
        .gallery-item {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-lg);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <nav class="navbar" id="navbar">
        <a href="index.html" class="logo">Fidler Family</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="family.html">Our Tree</a></li>
            <li><a href="photos.html" class="active">Gallery</a></li>
            <li><a href="blog.html">News</a></li>
        </ul>
    </nav>

    <header class="hero" style="height: 50vh; padding-top: 100px; background: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;">
        <div class="hero-content">
            <h1 style="font-size: 3rem;">Photo Gallery</h1>
            <p>Cherished moments, captured forever.</p>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Memories</h2>
        
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1542037104857-ffbb0b91552d?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Family gathering">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1502444330042-d1a1ddf9bb5b?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Vacation">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Meeting">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1519751138087-5bf79df62d5b?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Celebration">
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 The Fidler Family. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
