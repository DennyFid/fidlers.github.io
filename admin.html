<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - Moderate Comments</title>
  <link rel="stylesheet" href="styles.css">
  <style>
	.admin{max-width:1000px;margin:2rem auto;padding:1rem}
	table{width:100%;border-collapse:collapse}
	td,th{padding:8px;border-bottom:1px solid #eee;vertical-align:top}
	img.thumb{max-width:160px;border-radius:6px}
	.btn{cursor:pointer;padding:6px 8px;border-radius:6px}
  </style>
</head>
<body>
  <nav class="navbar"><a href="index.html" class="logo">Fidler Family</a></nav>
  <main class="container admin">
	<h1>Moderate Comments</h1>
	<p>Enter admin key (set as ADMIN_KEY in Vercel). Buttons: Approve (makes comment public), Reject (deletes).</p>
	<label>Admin key: <input id="adminkey" type="password" style="width:60%"></label>
	<button id="load" class="btn">Load Comments</button>
	<div id="status" style="margin-top:0.5rem;color:#666"></div>
	<div id="list" style="margin-top:1rem"></div>
  </main>

  <script>
	function el(q){return document.querySelector(q)}
	async function load(){
	  const key = el('#adminkey').value.trim(); if(!key){ el('#status').textContent='Enter admin key'; return }
	  el('#status').textContent='Loading...';
	  try{
		const r = await fetch('/api/admin-list-comments?admin_key='+encodeURIComponent(key));
		if(!r.ok){ el('#status').textContent='Failed to load: '+(await r.text()); return }
		const j = await r.json(); render(j.comments,key);
		el('#status').textContent='Loaded '+(j.comments||[]).length+' comments';
	  }catch(e){ el('#status').textContent='Error loading'; console.error(e) }
	}

	function render(list,key){
	  const wrap=el('#list'); wrap.innerHTML='';
	  if(!list || !list.length){ wrap.innerHTML='<p>No comments</p>'; return }
	  const table=document.createElement('table');
	  const thead=document.createElement('thead'); thead.innerHTML='<tr><th>Id</th><th>When</th><th>Name</th><th>Content</th><th>Image</th><th>Actions</th></tr>'; table.appendChild(thead);
	  const tbody=document.createElement('tbody');
	  for(const c of list){
		const tr=document.createElement('tr');
		const when = c.created_at ? new Date(c.created_at).toLocaleString() : '';
		tr.innerHTML = `<td>${c.id}</td><td>${when}</td><td>${c.name||'Anonymous'}</td><td>${(c.content||'').replace(/</g,'&lt;')}</td><td>${c.image_url?`<img src="${c.image_url}" class="thumb">`:''}</td><td></td>`;
		const actions = tr.querySelector('td:last-child');
		const approve = document.createElement('button'); approve.textContent='Approve'; approve.className='btn'; approve.onclick = ()=>moderate(c.id,'approve',key);
		const reject = document.createElement('button'); reject.textContent='Reject'; reject.className='btn'; reject.style.marginLeft='6px'; reject.onclick = ()=>moderate(c.id,'reject',key);
		actions.appendChild(approve); actions.appendChild(reject);
		tbody.appendChild(tr);
	  }
	  table.appendChild(tbody); wrap.appendChild(table);
	}

	async function moderate(id,action,key){
	  if(!confirm(action+' comment '+id+'?')) return;
	  try{
		const r = await fetch('/api/admin-moderate', { method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-key': key }, body: JSON.stringify({ id, action }) });
		const j = await r.json(); if(!r.ok) { alert('Failed: '+(j.error||'')) } else { alert('OK'); load(); }
	  }catch(e){ alert('Error'); console.error(e) }
	}

	document.getElementById('load').addEventListener('click', load);
  </script>
</body>
</html>
